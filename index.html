/* ---------------------------------------------------------
   DATE HELPERS
--------------------------------------------------------- */
function daysUntil(dateStr) { const now = new Date(); now.setHours(0, 0, 0, 0); return Math.round((new Date(dateStr) - now) / 86400000); }
function toMin(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
function toHHMM(min) { const h = Math.floor(min / 60) % 24, m = min % 60; return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`; }
function todayIdx() { return (new Date().getDay() + 6) % 7; }
function todayStr() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.toISOString().slice(0, 10); }
function daysBetweenStr(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

function computeConfidence(subjectId, practiceTests) {
  const results = practiceTests.filter((t) => t.subjectId === subjectId);
  if (!results.length) return null;
  const avgPct = results.reduce((sum, t) => sum + (t.score / t.maxScore) * 100, 0) / results.length;
  return Math.round((avgPct / 10) * 10) / 10;
}
function taskRemaining(task, completedMinutesByTask) { return Math.max(0, task.duration - (completedMinutesByTask[task.id] || 0)); }

/* ---------------------------------------------------------
   SCHEDULING ENGINE
   - never before school, +1hr buffer after school ends
   - 1.5hr buffer before bedtime
   - heavier-weighted exams (marks) get scheduled more often
   - completed work reduces what's left to schedule
   - respects a weekly hour budget, not just a daily one
--------------------------------------------------------- */
function buildFreeSlots(dayIdx, school, work, events, settings) {
  const daySchool = school.filter((b) => b.day === dayIdx);
  const busy = [
    ...work.filter((b) => b.day === dayIdx).map((b) => [toMin(b.start), toMin(b.end)]),
    ...events.filter((b) => b.day === dayIdx).map((b) => [toMin(b.start), toMin(b.end)]),
  ].sort((a, b) => a[0] - b[0]);

  let wake = toMin(settings.wake);
  const bed = toMin(settings.bedtime) - (settings.bedtimeBufferMin ?? 90);

  if (daySchool.length) {
    const schoolEnd = Math.max(...daySchool.map((b) => toMin(b.end)));
    wake = Math.max(wake, schoolEnd + (settings.afterSchoolBufferMin ?? 60));
  }

  let free = [[wake, bed]];
  for (const [bs, be] of busy) {
    const next = [];
    for (const [fs, fe] of free) {
      if (be <= fs || bs >= fe) { next.push([fs, fe]); continue; }
      if (bs > fs) next.push([fs, bs]);
      if (be < fe) next.push([be, fe]);
    }
    free = next;
  }
  return free.filter(([s, e]) => e - s >= 20);
}

function scoreTask(task, subject) {
  const urgency = Math.max(0, 14 - task.dueInDays) * 3;
  const examProximity = subject ? Math.max(0, 90 - daysUntil(subject.examDate)) / 3 : 0;
  const priorityWeight = { High: 30, Medium: 15, Low: 5 }[task.priority] || 10;
  const confidenceGap = subject ? (10 - subject.confidence) * 4 : 0;
  const difficultyWeight = { Hard: 10, Medium: 5, Easy: 0 }[task.difficulty] || 0;
  const examWeight = subject ? (subject.examMarks || 20) * 0.6 : 0;
  return urgency + examProximity + priorityWeight + confidenceGap + difficultyWeight + examWeight;
}

function generateSchedule(tasks, subjects, school, work, events, settings, completedMinutesByTask) {
  const subjectMap = Object.fromEntries(subjects.map((s) => [s.id, s]));
  const ranked = tasks
    .map((t) => ({ ...t, remaining: taskRemaining(t, completedMinutesByTask), score: scoreTask(t, subjectMap[t.subjectId]) }))
    .filter((t) => t.remaining > 0)
    .sort((a, b) => b.score - a.score);

  const sessionsByDay = {}, dayFree = {};
  for (let d = 0; d < 7; d++) { dayFree[d] = buildFreeSlots(d, school, work, events, settings).map(([s, e]) => ({ start: s, end: e })); sessionsByDay[d] = []; }

  const dailyBudget = settings.maxDailyStudyHours * 60;
  const weeklyBudget = (settings.weeklyStudyHours || 14) * 60;
  const dailyUsed = Array(7).fill(0);
  let weeklyUsed = 0;

  for (const task of ranked) {
    if (weeklyUsed >= weeklyBudget) break;
    let guard = 0;
    while (task.remaining > 0 && guard < 20 && weeklyUsed < weeklyBudget) {
      guard++;
      let placed = false;
      for (let d = 0; d < 7 && !placed; d++) {
        if (dailyUsed[d] >= dailyBudget) continue;
        for (const slot of dayFree[d]) {
          const avail = slot.end - slot.start;
          if (avail < 20) continue;
          const chunk = Math.min(task.remaining, settings.blockLength, avail, dailyBudget - dailyUsed[d], weeklyBudget - weeklyUsed);
          if (chunk < 20) continue;
          sessionsByDay[d].push({ id: `${task.id}-${d}-${slot.start}`, taskId: task.id, subjectId: task.subjectId, title: task.title, start: slot.start, end: slot.start + chunk, type: "Study" });
          slot.start += chunk + settings.breakLength;
          dailyUsed[d] += chunk; weeklyUsed += chunk; task.remaining -= chunk;
          placed = true;
          break;
        }
      }
      if (!placed) break;
    }
  }
  for (let d = 0; d < 7; d++) sessionsByDay[d].sort((a, b) => a.start - b.start);
  return sessionsByDay;
}

    case "briefcase": return <svg viewBox="0 0 24 24" style={s} {...c}><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    case "grad": return <svg viewBox="0 0 24 24" style={s} {...c}><path d="M2 9l10-5 10 5-10 5-10-5z"/><path d="M6 11.5V17c0 1 3 2.5 6 2.5s6-1.5 6-2.5v-5.5"/></svg>;
    case "dumbbell": return <svg viewBox="0 0 24 24" style={s} {...c}><path d="M4 9v6"/><path d="M2 10v4"/><path d="M8 7v10"/><path d="M16 7v10"/><path d="M8 12h8"/><path d="M20 10v4"/><path d="M22 9v6"/></svg>;
    case "check": return <svg viewBox="0 0 24 24" style={s} {...c}><path d="M20 6L9 17l-5-5"/></svg>;
    case "x": return <svg viewBox="0 0 24 24" style={s} {...c}><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>;
    case "trash": return <svg viewBox="0 0 24 24" style={s} {...c}><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>;
    case "plus": return <svg viewBox="0 0 24 24" style={s} {...c}><path d="M12 5v14"/><path d="M5 12h14"/></svg>;
    case "chevron": return <svg viewBox="0 0 24 24" style={s} {...c}><path d="M9 6l6 6-6 6"/></svg>;
    case "back": return <svg viewBox="0 0 24 24" style={s} {...c}><path d="M15 6l-6 6 6 6"/></svg>;
    case "clock": return <svg viewBox="0 0 24 24" style={s} {...c}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>;

}
function MiniBarChart({ data }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 14, height: 160, padding: "0 4px" }}>
      {data.map((d) => (
        <div key={d.label} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
          <div style={{ fontSize: 11, fontWeight: 600 }}>{d.value}h</div>
          <div style={{ width: "70%", height: Math.max(4, (d.value / max) * 120), background: d.color, borderRadius: "5px 5px 2px 2px" }} />
          <div style={{ fontSize: 10.5, color: "var(--text-secondary)" }}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}
function MiniRadar({ data }) {
  const size = 220, cx = size / 2, cy = size / 2, r = 78, n = data.length;
  const pts = data.map((d, i) => { const a = (Math.PI * 2 * i) / n - Math.PI / 2, val = (d.value / 10) * r; return [cx + val * Math.cos(a), cy + val * Math.sin(a)]; });
  const ringPts = (f) => data.map((_, i) => { const a = (Math.PI * 2 * i) / n - Math.PI / 2; return [cx + r * f * Math.cos(a), cy + r * f * Math.sin(a)]; }).map((p) => p.join(",")).join(" ");
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width="100%" height="220">
      {[0.33, 0.66, 1].map((f) => <polygon key={f} points={ringPts(f)} fill="none" stroke="var(--border)" strokeWidth="1" />)}
      <polygon points={pts.map((p) => p.join(",")).join(" ")} fill={AMBER + "55"} stroke={AMBER} strokeWidth="2" />
      {data.map((d, i) => { const a = (Math.PI * 2 * i) / n - Math.PI / 2, lx = cx + (r + 18) * Math.cos(a), ly = cy + (r + 18) * Math.sin(a); return <text key={d.label} x={lx} y={ly} fontSize="10.5" textAnchor="middle" fill="var(--text-secondary)">{d.label}</text>; })}
    </svg>
  );
}

/* ---------------------------------------------------------
   MAIN APP
--------------------------------------------------------- */
function StudyFlow() {
  const [dark, setDark] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [selectedSubjectId, setSelectedSubjectId] = useState(null);
  const [subjectsBase, setSubjectsBase] = useState(seedSubjects);
  const [school, setSchool] = useState(seedSchool);
  const [work, setWork] = useState(seedWork);
  const [events, setEvents] = useState(seedEvents);
  const [tasks, setTasks] = useState(seedTasks);
  const [practiceTests, setPracticeTests] = useState(seedPracticeTests);
  const [settings, setSettings] = useState(defaultSettings);
  const [completedMinutesByTask, setCompletedMinutesByTask] = useState({});
  const [streak, setStreak] = useState({ current: 0, lastActiveDate: null });
  const [assistantAnswer, setAssistantAnswer] = useState(null);
  const [saveState, setSaveState] = useState("saved");
  const [syncPin, setSyncPin] = useState(() => { try { return localStorage.getItem(SYNC_PIN_KEY) || ""; } catch (e) { return ""; } });
  const [syncStatus, setSyncStatus] = useState("local");
  const loadedOnce = useRef(false);
  const applyingRemote = useRef(false);

  function openSubject(id) { setSelectedSubjectId(id); setTab("subject"); }

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data.subjectsBase) setSubjectsBase(data.subjectsBase);
        if (data.school) setSchool(data.school);
        if (data.work) setWork(data.work);
        if (data.events) setEvents(data.events);
        if (data.tasks) setTasks(data.tasks);
        if (data.practiceTests) setPracticeTests(data.practiceTests);
        if (data.settings) setSettings({ ...defaultSettings, ...data.settings });
        if (data.completedMinutesByTask) setCompletedMinutesByTask(data.completedMinutesByTask);
        if (data.streak) setStreak(data.streak);
      }
    } catch (e) {}
    loadedOnce.current = true;
  }, []);

  useEffect(() => {
    if (!syncPin || !firebaseReady || !db) { setSyncStatus(syncPin && !firebaseReady ? "error" : "local"); return; }
    setSyncStatus("connecting");
    const ref = db.collection("studyflow-sync").doc(syncPin);
    const unsub = ref.onSnapshot((snap) => {
      if (snap.exists) {
        const data = snap.data() || {};
        applyingRemote.current = true;
        if (data.subjectsBase) setSubjectsBase(data.subjectsBase);
        if (data.school) setSchool(data.school);
        if (data.work) setWork(data.work);
        if (data.events) setEvents(data.events);
        if (data.tasks) setTasks(data.tasks);
        if (data.practiceTests) setPracticeTests(data.practiceTests);
        if (data.settings) setSettings({ ...defaultSettings, ...data.settings });
        if (data.completedMinutesByTask) setCompletedMinutesByTask(data.completedMinutesByTask);
        if (data.streak) setStreak(data.streak);
      } else {
        ref.set({ subjectsBase, school, work, events, tasks, practiceTests, settings, completedMinutesByTask, streak, updatedAt: Date.now() }).catch(() => setSyncStatus("error"));
      }
      setSyncStatus("synced");
    }, () => setSyncStatus("error"));
    return () => unsub();
  }, [syncPin]);

  useEffect(() => {
    if (!loadedOnce.current) return;
    if (applyingRemote.current) { applyingRemote.current = false; return; }
    setSaveState("saving");
    const t = setTimeout(() => {
      try {
        const payload = { subjectsBase, school, work, events, tasks, practiceTests, settings, completedMinutesByTask, streak };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        if (syncPin && firebaseReady && db) {
          db.collection("studyflow-sync").doc(syncPin).set({ ...payload, updatedAt: Date.now() }, { merge: true }).catch(() => setSyncStatus("error"));
        }
        setSaveState("saved");
      } catch (e) { setSaveState("error"); }
    }, 300);
    return () => clearTimeout(t);
  }, [subjectsBase, school, work, events, tasks, practiceTests, settings, completedMinutesByTask, streak]);

  function connectSync(pin) { const clean = pin.trim(); if (!clean) return; try { localStorage.setItem(SYNC_PIN_KEY, clean); } catch (e) {} setSyncPin(clean); }
  function disconnectSync() { try { localStorage.removeItem(SYNC_PIN_KEY); } catch (e) {} setSyncPin(""); setSyncStatus("local"); }
  function generateSyncCode() { const code = Math.random().toString(36).slice(2, 8).toUpperCase(); connectSync(code); return code; }

  const subjects = useMemo(() => subjectsBase.map((s) => {
    const conf = computeConfidence(s.id, practiceTests);
    return { ...s, confidence: conf ?? 5, avgScore: conf, testCount: practiceTests.filter((t) => t.subjectId === s.id).length };
  }), [subjectsBase, practiceTests]);
  const subjectMap = useMemo(() => Object.fromEntries(subjects.map((s) => [s.id, s])), [subjects]);
  const schedule = useMemo(() => generateSchedule(tasks, subjects, school, work, events, settings, completedMinutesByTask), [tasks, subjects, school, work, events, settings, completedMinutesByTask]);

  const today = todayIdx();
  const todaySessions = schedule[today] || [];
  const weekMinutes = Object.values(schedule).flat().reduce((a, s) => a + (s.end - s.start), 0);
  const weekHours = Math.round((weekMinutes / 60) * 10) / 10;
  const targetHours = settings.weeklyStudyHours;
  const totalSessions = Object.values(schedule).flat().length;
  const completedSessionsThisWeek = Object.keys(completedMinutesByTask).length ? Object.entries(completedMinutesByTask).reduce((a, [, m]) => a + (m > 0 ? 1 : 0), 0) : 0;

  function addTask(t) { setTasks((prev) => [...prev, { ...t, id: "t" + Date.now() + Math.random().toString(36).slice(2, 5) }]); }
  function removeTask(id) { setTasks((prev) => prev.filter((t) => t.id !== id)); setCompletedMinutesByTask((prev) => { const n = { ...prev }; delete n[id]; return n; }); }
  function adjustTaskDuration(id, delta) { setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, duration: Math.max(15, t.duration + delta) } : t))); }
  function markTaskDone(id) { const t = tasks.find((x) => x.id === id); if (!t) return; setCompletedMinutesByTask((prev) => ({ ...prev, [id]: t.duration })); bumpStreak(); }
  function markSessionDone(session) { setCompletedMinutesByTask((prev) => ({ ...prev, [session.taskId]: (prev[session.taskId] || 0) + (session.end - session.start) })); bumpStreak(); }

  function bumpStreak() {
    setStreak((prev) => {
      const t = todayStr();
      if (prev.lastActiveDate === t) return prev;
      const gap = prev.lastActiveDate ? daysBetweenStr(prev.lastActiveDate, t) : null;
      return { current: gap === 1 ? prev.current + 1 : 1, lastActiveDate: t };
    });
  }
  const streakDisplay = useMemo(() => (!streak.lastActiveDate ? 0 : daysBetweenStr(streak.lastActiveDate, todayStr()) <= 1 ? streak.current : 0), [streak]);

  function addPracticeTest(t) { setPracticeTests((prev) => [...prev, { ...t, id: "pt" + Date.now() }]); }
  function removePracticeTest(id) { setPracticeTests((prev) => prev.filter((t) => t.id !== id)); }

  function addSubject(s) { setSubjectsBase((prev) => [...prev, { id: "sub" + Date.now(), name: s.name, color: SUBJECT_PALETTE[prev.length % SUBJECT_PALETTE.length], examDate: s.examDate, examMarks: s.examMarks, topics: [] }]); }
  function removeSubject(id) {
    setSubjectsBase((prev) => prev.filter((s) => s.id !== id));
    setTasks((prev) => prev.filter((t) => t.subjectId !== id));
    setPracticeTests((prev) => prev.filter((t) => t.subjectId !== id));
  }
  function toggleTopicDone(subjectId, topicId) {
    setSubjectsBase((prev) => prev.map((s) => (s.id === subjectId ? { ...s, topics: s.topics.map((t) => (t.id === topicId ? { ...t, done: !t.done } : t)) } : s)));
  }
  function addTopicAsTask(subjectId, topic) {
    addTask({ subjectId, title: topic.subtopic, duration: Math.min(topic.hours * 60, 240), priority: "Medium", dueInDays: 14, difficulty: "Medium", type: "Revision" });
  }

  function askAssistant(question) {
    let answer = "";
    if (question === "tonight") {
      answer = todaySessions.length === 0 ? "Nothing's scheduled for the rest of today — free time if you want to get ahead."
        : "Here's tonight's plan:\n" + todaySessions.map((s) => `${toHHMM(s.start)} – ${subjectMap[s.subjectId]?.name}: ${s.title} (${s.end - s.start} min)`).join("\n");
    } else if (question === "prioritise") {
      const worst = [...subjects].sort((a, b) => a.confidence - b.confidence)[0];
      const soonest = [...subjects].sort((a, b) => daysUntil(a.examDate) - daysUntil(b.examDate))[0];
      answer = worst ? `Focus on ${worst.name} first — it's your lowest confidence subject (${worst.confidence}/10). ${soonest.name} has the nearest exam, in ${daysUntil(soonest.examDate)} days, so keep chipping away at it too.` : "Add a subject first and I can help you prioritise.";
    } else if (question === "90min") {
      const pick = [...tasks].filter((t) => taskRemaining(t, completedMinutesByTask) > 0).sort((a, b) => scoreTask(b, subjectMap[b.subjectId]) - scoreTask(a, subjectMap[a.subjectId]))[0];
      answer = pick ? `With 90 minutes, put it into "${pick.title}" for ${subjectMap[pick.subjectId]?.name} — it's your highest-priority open task right now. Do 2 x 40 min blocks with a short break between.` : "No open tasks queued — head into a subject page and add one, or queue up a syllabus topic.";
    } else if (question === "reschedule") {
      answer = "Schedule rebuilt around your current shifts, due dates and exam weightings — check the Calendar tab for the updated week.";
    }
    setAssistantAnswer(answer);
  }

  const vars = dark
    ? { "--bg": PAPER_DARK, "--card": "#1C212B", "--border": "#2A2F3A", "--text-primary": "#F3F1EA", "--text-secondary": "#9A9A93", "--nav-active": "#262B36" }
    : { "--bg": PAPER, "--card": "#FFFFFF", "--border": "#E7E4DB", "--text-primary": INK, "--text-secondary": "#6B6F7B", "--nav-active": "#F1ECDD" };

  const selectedSubject = subjects.find((s) => s.id === selectedSubjectId);

  return (
    <div style={{ ...vars, background: "var(--bg)", color: "var(--text-primary)", minHeight: "100vh", display: "flex" }}>
      <style>{`
        .sf-title { font-family: 'Space Grotesk', sans-serif; }
        .sf-input, .sf-select { font-family: 'Inter', sans-serif; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-primary); }
        .sf-btn { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px; border: none; background: ${INK}; color: white; cursor: pointer; }
        .sf-btn-ghost { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); cursor: pointer; }
        .sf-btn-tiny { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); cursor: pointer; }
        @media (max-width: 760px) {
          .sf-sidebar { position: fixed; bottom: 0; left: 0; right: 0; width: 100% !important; height: 60px; flex-direction: row !important; border-right: none !important; border-top: 1px solid var(--border); padding: 6px 8px !important; overflow-x: auto; z-index: 10; }
          .sf-sidebar .sf-logo, .sf-sidebar .sf-status, .sf-sidebar .sf-darkbtn { display: none !important; }
          .sf-sidebar button { flex-direction: column; gap: 2px !important; font-size: 10px !important; padding: 6px 4px !important; white-space: nowrap; }
          .sf-main { padding-bottom: 76px !important; }
          .sf-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
          .sf-grid-7 { grid-template-columns: repeat(7, minmax(70px,1fr)) !important; overflow-x: auto; }
        }
      `}</style>

      <div className="sf-sidebar" style={{ width: 200, borderRight: "1px solid var(--border)", padding: "1.1rem 0.85rem", display: "flex", flexDirection: "column", gap: 4 }}>
        <div className="sf-logo sf-title" style={{ fontSize: 18, fontWeight: 700, padding: "0 8px 18px", display: "flex", alignItems: "center", gap: 7 }}>
          <span style={{ width: 9, height: 9, borderRadius: 3, background: AMBER, display: "inline-block" }} /> StudyFlow
        </div>
        <IconBtn icon="home" label="Dashboard" active={tab === "dashboard"} onClick={() => setTab("dashboard")} />
        <IconBtn icon="calendar" label="Calendar" active={tab === "calendar"} onClick={() => setTab("calendar")} />
        <IconBtn icon="grad" label="Subjects" active={tab === "subjects" || tab === "subject"} onClick={() => setTab("subjects")} />
        <IconBtn icon="setup" label="Setup" active={tab === "setup"} onClick={() => setTab("setup")} />
        <IconBtn icon="chart" label="Analytics" active={tab === "analytics"} onClick={() => setTab("analytics")} />
        <IconBtn icon="sparkles" label="AI assistant" active={tab === "assistant"} onClick={() => setTab("assistant")} />
        <IconBtn icon="gear" label="Settings" active={tab === "settings"} onClick={() => setTab("settings")} />
        <div style={{ flex: 1 }} />
        <div className="sf-status" style={{ fontSize: 10.5, color: "var(--text-secondary)", padding: "0 8px 6px" }}>
          {syncPin ? (syncStatus === "synced" ? "Synced" : syncStatus === "connecting" ? "Connecting…" : "Sync error") : (saveState === "saving" ? "Saving…" : saveState === "error" ? "Save failed" : "Saved on this device")}
        </div>
        <button className="sf-darkbtn sf-btn-ghost" onClick={() => setDark((d) => !d)}>{dark ? "Light mode" : "Dark mode"}</button>
      </div>

      <div className="sf-main" style={{ flex: 1, padding: "1.4rem 1.6rem", overflowY: "auto" }}>
        {tab === "dashboard" && <Dashboard subjects={subjects} todaySessions={todaySessions} weekHours={weekHours} targetHours={targetHours} totalSessions={totalSessions} completedSessionsThisWeek={completedSessionsThisWeek} onMarkSessionDone={markSessionDone} onOpenSubject={openSubject} />}
        {tab === "calendar" && <CalendarView schedule={schedule} school={school} work={work} events={events} subjects={subjects} />}
        {tab === "subjects" && <SubjectsView subjects={subjects} addSubject={addSubject} onOpen={openSubject} />}
        {tab === "subject" && (selectedSubject
          ? <SubjectDetailView subject={selectedSubject} tasks={tasks.filter((t) => t.subjectId === selectedSubject.id)} completedMinutesByTask={completedMinutesByTask}
              addTask={(f) => addTask({ ...f, subjectId: selectedSubject.id })} removeTask={removeTask} adjustTaskDuration={adjustTaskDuration} markTaskDone={markTaskDone}
              toggleTopicDone={(topicId) => toggleTopicDone(selectedSubject.id, topicId)} addTopicAsTask={(topic) => addTopicAsTask(selectedSubject.id, topic)}
              practiceTests={practiceTests.filter((t) => t.subjectId === selectedSubject.id)} addPracticeTest={(t) => addPracticeTest({ ...t, subjectId: selectedSubject.id })} removePracticeTest={removePracticeTest}
              onBack={() => setTab("subjects")} onDelete={() => { removeSubject(selectedSubject.id); setTab("subjects"); }} />
          : <div><p style={{ fontSize: 13, color: "var(--text-secondary)" }}>Subject not found.</p><button className="sf-btn-ghost" onClick={() => setTab("subjects")}>Back to subjects</button></div>)}
        {tab === "setup" && <SetupView school={school} setSchool={setSchool} work={work} setWork={setWork} events={events} setEvents={setEvents} />}
        {tab === "analytics" && <AnalyticsView subjects={subjects} schedule={schedule} tasks={tasks} completedMinutesByTask={completedMinutesByTask} totalSessions={totalSessions} streakDisplay={streakDisplay} />}
        {tab === "assistant" && <AssistantView askAssistant={askAssistant} answer={assistantAnswer} />}
        {tab === "settings" && <SettingsView settings={settings} setSettings={setSettings} syncPin={syncPin} syncStatus={syncStatus} connectSync={connectSync} disconnectSync={disconnectSync} generateSyncCode={generateSyncCode} />}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   DASHBOARD
--------------------------------------------------------- */
function Dashboard({ subjects, todaySessions, weekHours, targetHours, totalSessions, completedSessionsThisWeek, onMarkSessionDone, onOpenSubject }) {
  const pct = targetHours ? Math.min(100, Math.round((weekHours / targetHours) * 100)) : 0;
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 22, fontWeight: 700, margin: "0 0 2px" }}>Good to see you</h1>
      <p style={{ color: "var(--text-secondary)", fontSize: 13, margin: "0 0 20px" }}>Here's how the week's shaping up.</p>

      </div>

      <div className="sf-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12 }}>
        {subjects.map((s) => {
          const d = daysUntil(s.examDate);
          const color = d <= 14 ? CAT_COLORS.Exam : d <= 35 ? "#D9822B" : d <= 60 ? "#C7A21B" : CAT_COLORS.Study;
          const covered = s.topics.length ? Math.round((s.topics.filter((t) => t.done).length / s.topics.length) * 100) : null;
          return (
            <Card key={s.id} onClick={() => onOpenSubject(s.id)} style={{ borderColor: color + "55", cursor: "pointer" }}>
              <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 4 }}>{s.name}</div>
              <div className="sf-title" style={{ fontSize: 24, fontWeight: 700, color }}>{d}</div>
              <div style={{ fontSize: 11, color: "var(--text-secondary)", marginBottom: 6 }}>days remaining · {s.examMarks}% weighting</div>
              {covered !== null && <div style={{ fontSize: 11, color: "var(--text-secondary)" }}>{covered}% of syllabus checked off</div>}
            </Card>
          );
        })}
        {subjects.length === 0 && <p style={{ fontSize: 13, color: "var(--text-secondary)" }}>No subjects yet — add one from the Subjects tab.</p>}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   CALENDAR
--------------------------------------------------------- */
function CalendarView({ schedule, school, work, events, subjects }) {
  const START = 7 * 60, END = 23 * 60, pxPerMin = 0.85;
  const subjectMap = Object.fromEntries(subjects.map((s) => [s.id, s]));
  function blocksFor(d) {
    const list = [];
    school.filter((b) => b.day === d).forEach(() => list.push({ start: school.find((x) => x.day === d).start, end: school.find((x) => x.day === d).end, type: "School", label: "School" }));
    work.filter((b) => b.day === d).forEach((b) => list.push({ ...b, type: "Work", label: "Work" }));
    events.filter((b) => b.day === d).forEach((b) => list.push({ ...b, type: b.type, label: b.title }));
    (schedule[d] || []).forEach((s) => list.push({ start: toHHMM(s.start), end: toHHMM(s.end), type: "Study", label: `${subjectMap[s.subjectId]?.name}: ${s.title}` }));
    return list;
  }
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 20, fontWeight: 700, marginBottom: 4 }}>This week</h1>
      <p style={{ fontSize: 12, color: "var(--text-secondary)", marginBottom: 12 }}>Rebuilds automatically whenever you add, finish, or adjust work.</p>
      <div style={{ display: "flex", gap: 12, marginBottom: 14, flexWrap: "wrap" }}>
        {Object.entries(CAT_COLORS).filter(([k]) => k !== "Break").map(([k, c]) => <span key={k} style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 5, color: "var(--text-secondary)" }}><span style={{ width: 8, height: 8, borderRadius: 2, background: c }} /> {k}</span>)}
      </div>
      <div className="sf-grid-7" style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 8 }}>
        {DAYS.map((day, d) => (
          <div key={day}>
            <div style={{ fontSize: 11.5, fontWeight: 600, marginBottom: 6, color: d === todayIdx() ? AMBER : "var(--text-secondary)" }}>{day}</div>
            <div style={{ position: "relative", height: (END - START) * pxPerMin, borderRadius: 10, background: "var(--card)", border: "1px solid var(--border)", overflow: "hidden" }}>
              {blocksFor(d).map((b, i) => {
                const s = toMin(b.start) - START, e = toMin(b.end) - START;
                if (e < 0 || s > END - START) return null;
                const color = CAT_COLORS[b.type] || CAT_COLORS.Personal;
                return <div key={i} title={b.label} style={{ position: "absolute", top: Math.max(0, s) * pxPerMin, height: Math.max(14, (e - s) * pxPerMin), left: 3, right: 3, background: color + "26", borderLeft: `3px solid ${color}`, borderRadius: 5, fontSize: 9.5, padding: "2px 4px", overflow: "hidden" }}>{b.label}</div>;
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   SUBJECT DETAIL — progress, syllabus checklist, tasks
--------------------------------------------------------- */
function SubjectDetailView({ subject, tasks, completedMinutesByTask, addTask, removeTask, adjustTaskDuration, markTaskDone, toggleTopicDone, addTopicAsTask, practiceTests, addPracticeTest, removePracticeTest, onBack, onDelete }) {
  const [taskForm, setTaskForm] = useState({ title: "", duration: 45, priority: "Medium", dueInDays: 5, difficulty: "Medium", type: "Revision" });
  const [pForm, setPForm] = useState({ label: "", score: "", maxScore: 100 });
  const [confirmDelete, setConfirmDelete] = useState(false);

  const activeTasks = tasks.filter((t) => taskRemaining(t, completedMinutesByTask) > 0);
  const doneTasks = tasks.filter((t) => taskRemaining(t, completedMinutesByTask) <= 0);
  const totalMinutesLogged = tasks.reduce((a, t) => a + (completedMinutesByTask[t.id] || 0), 0);
  const hoursLogged = Math.round((totalMinutesLogged / 60) * 10) / 10;
  const covered = subject.topics.length ? Math.round((subject.topics.filter((t) => t.done).length / subject.topics.length) * 100) : null;
  const units = [...new Set(subject.topics.map((t) => t.unit))];

  return (
    <div>
      <button className="sf-btn-ghost" onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 14 }}><Icon name="back" size={13} /> All subjects</button>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
        <span style={{ width: 12, height: 12, borderRadius: 4, background: subject.color, display: "inline-block" }} />
        <h1 className="sf-title" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>{subject.name}</h1>
      </div>
      <p style={{ fontSize: 12.5, color: "var(--text-secondary)", marginBottom: 18 }}>Exam on {subject.examDate} · {daysUntil(subject.examDate)} days away · {subject.examMarks}% of your external weighting</p>

      <div className="sf-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 18 }}>
        <Card><div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Confidence</div><div className="sf-title" style={{ fontSize: 20, fontWeight: 700 }}>{subject.confidence}/10</div></Card>
        <Card><div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Hours logged</div><div className="sf-title" style={{ fontSize: 20, fontWeight: 700 }}>{hoursLogged}h</div></Card>
        <Card><div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Open tasks</div><div className="sf-title" style={{ fontSize: 20, fontWeight: 700 }}>{activeTasks.length}</div></Card>
        <Card><div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Syllabus covered</div><div className="sf-title" style={{ fontSize: 20, fontWeight: 700 }}>{covered === null ? "—" : covered + "%"}</div></Card>
      </div>

      {subject.topics.length > 0 && (
        <Card style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>Unit 3 & 4 syllabus checklist</div>
          {units.map((unit) => (
            <div key={unit} style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--text-secondary)", marginBottom: 6 }}>{unit}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                {subject.topics.filter((t) => t.unit === unit).map((t) => (
                  <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, padding: "5px 8px", borderRadius: 8, background: t.done ? "var(--nav-active)" : "transparent" }}>
                    <button onClick={() => toggleTopicDone(t.id)} className="sf-btn-tiny" style={{ padding: "2px 6px", background: t.done ? subject.color : "transparent", color: t.done ? "white" : "var(--text-primary)", borderColor: t.done ? subject.color : "var(--border)" }}>
                      <Icon name="check" size={10} />
                    </button>
                    <span style={{ flex: 1, textDecoration: t.done ? "line-through" : "none", color: t.done ? "var(--text-secondary)" : "var(--text-primary)" }}>{t.topic} — {t.subtopic}</span>
                    {!t.done && <button className="sf-btn-tiny" onClick={() => addTopicAsTask(t)}>Add to schedule</button>}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </Card>
      )}

      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>Quick add a task</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(110px,1fr))", gap: 8 }}>
          <input className="sf-input" placeholder="Task title" value={taskForm.title} onChange={(e) => setTaskForm({ ...taskForm, title: e.target.value })} style={{ gridColumn: "span 2" }} />
          <input className="sf-input" type="number" placeholder="Minutes" value={taskForm.duration} onChange={(e) => setTaskForm({ ...taskForm, duration: Number(e.target.value) })} />
          <select className="sf-select" value={taskForm.priority} onChange={(e) => setTaskForm({ ...taskForm, priority: e.target.value })}><option>Low</option><option>Medium</option><option>High</option></select>
          <input className="sf-input" type="number" placeholder="Due in days" value={taskForm.dueInDays} onChange={(e) => setTaskForm({ ...taskForm, dueInDays: Number(e.target.value) })} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(110px,1fr))", gap: 8, marginTop: 8 }}>
          <select className="sf-select" value={taskForm.type} onChange={(e) => setTaskForm({ ...taskForm, type: e.target.value })}>{["Revision", "Practice questions", "Past paper", "Reading", "Flashcards", "Essay", "Practical"].map((t) => <option key={t}>{t}</option>)}</select>
          <select className="sf-select" value={taskForm.difficulty} onChange={(e) => setTaskForm({ ...taskForm, difficulty: e.target.value })}><option>Easy</option><option>Medium</option><option>Hard</option></select>
          <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end" }}>
            <button className="sf-btn" onClick={() => { if (taskForm.title.trim()) { addTask(taskForm); setTaskForm({ ...taskForm, title: "" }); } }}><Icon name="plus" size={13} /> Add task</button>
          </div>
        </div>
      </Card>

      <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8 }}>Open tasks</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
        {activeTasks.length === 0 && <p style={{ fontSize: 12.5, color: "var(--text-secondary)" }}>Nothing queued — add a task above or queue a syllabus topic.</p>}
        {activeTasks.map((t) => {
          const remaining = taskRemaining(t, completedMinutesByTask);
          const loggedPct = t.duration ? Math.round(((t.duration - remaining) / t.duration) * 100) : 0;
          return (
            <Card key={t.id} style={{ padding: "10px 14px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 600 }}>{t.title}</div>
                  <div style={{ fontSize: 11, color: "var(--text-secondary)" }}>{t.type} · {remaining} min left of {t.duration} · due in {t.dueInDays}d {loggedPct > 0 ? `· ${loggedPct}% logged` : ""}</div>
                </div>
                <Pill label={t.priority} color={t.priority === "High" ? CAT_COLORS.Exam : t.priority === "Medium" ? AMBER : CAT_COLORS.Study} />
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8 }}>
                <span style={{ fontSize: 10.5, color: "var(--text-secondary)" }}>Behind or need more time?</span>
                <button className="sf-btn-tiny" onClick={() => adjustTaskDuration(t.id, 15)}>+15m</button>
                <span style={{ fontSize: 10.5, color: "var(--text-secondary)" }}>Ahead of schedule?</span>
                <button className="sf-btn-tiny" onClick={() => adjustTaskDuration(t.id, -15)}>−15m</button>
                <div style={{ flex: 1 }} />
                <button className="sf-btn-tiny" onClick={() => markTaskDone(t.id)}>Mark fully done</button>
                <button onClick={() => removeTask(t.id)} className="sf-btn-ghost" style={{ padding: "3px 7px" }}><Icon name="trash" size={12} /></button>
              </div>
            </Card>
          );
        })}
        {doneTasks.length > 0 && (
          <details style={{ marginTop: 6 }}>
            <summary style={{ fontSize: 11.5, color: "var(--text-secondary)", cursor: "pointer" }}>{doneTasks.length} completed</summary>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 8 }}>
              {doneTasks.map((t) => (
                <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12, color: "var(--text-secondary)" }}>
                  <span style={{ textDecoration: "line-through", flex: 1 }}>{t.title}</span>
                  <button onClick={() => removeTask(t.id)} className="sf-btn-ghost" style={{ padding: "3px 7px" }}><Icon name="trash" size={11} /></button>
                </div>
              ))}
            </div>
          </details>
        )}
      </div>

      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 4 }}>Practice test results</div>
        <div style={{ fontSize: 11.5, color: "var(--text-secondary)", marginBottom: 10 }}>Confidence above is the average of what you log here.</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {practiceTests.length === 0 && <div style={{ fontSize: 12, color: "var(--text-secondary)" }}>No results logged yet.</div>}
          {practiceTests.map((t) => (
            <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12.5 }}>
              <span style={{ color: "var(--text-secondary)" }}>{t.label || "Practice test"}</span>
              <span style={{ marginLeft: "auto", fontWeight: 600 }}>{t.score}/{t.maxScore} ({Math.round((t.score / t.maxScore) * 100)}%)</span>
              <button onClick={() => removePracticeTest(t.id)} className="sf-btn-ghost" style={{ padding: "3px 7px" }}><Icon name="x" size={12} /></button>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input className="sf-input" placeholder="Test name (optional)" value={pForm.label} onChange={(e) => setPForm({ ...pForm, label: e.target.value })} />
          <input className="sf-input" type="number" placeholder="Score" style={{ width: 90 }} value={pForm.score} onChange={(e) => setPForm({ ...pForm, score: e.target.value })} />
          <input className="sf-input" type="number" placeholder="Out of" style={{ width: 90 }} value={pForm.maxScore} onChange={(e) => setPForm({ ...pForm, maxScore: e.target.value })} />
          <button className="sf-btn" onClick={() => { const score = Number(pForm.score), maxScore = Number(pForm.maxScore); if (score >= 0 && maxScore > 0) { addPracticeTest({ label: pForm.label, score, maxScore }); setPForm({ label: "", score: "", maxScore: 100 }); } }}>Add result</button>
        </div>
      </Card>

      <Card style={{ borderColor: CAT_COLORS.Exam + "55" }}>
        {!confirmDelete ? (
          <button className="sf-btn-ghost" onClick={() => setConfirmDelete(true)}>Delete this subject</button>
        ) : (
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 12.5 }}>Delete {subject.name} and all its tasks? This can't be undone.</span>
            <button className="sf-btn" style={{ background: CAT_COLORS.Exam }} onClick={onDelete}>Yes, delete</button>
            <button className="sf-btn-ghost" onClick={() => setConfirmDelete(false)}>Cancel</button>
          </div>
        )}
      </Card>
    </div>
  );
}

        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <select className="sf-select" value={wForm.day} onChange={(e) => setWForm({ ...wForm, day: Number(e.target.value) })}>{DAYS.map((d, i) => <option key={d} value={i}>{d}</option>)}</select>
          <input className="sf-input" type="time" value={wForm.start} onChange={(e) => setWForm({ ...wForm, start: e.target.value })} />
          <input className="sf-input" type="time" value={wForm.end} onChange={(e) => setWForm({ ...wForm, end: e.target.value })} />
          <button className="sf-btn" onClick={() => setWork([...work, { ...wForm, id: "w" + Date.now() }])}>Add shift</button>
        </div>
      </Card>
      <Card>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}><Icon name="dumbbell" size={14} /> Other events</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {events.map((b) => (
            <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12.5 }}>
              <span style={{ width: 40, fontWeight: 600 }}>{DAYS[b.day]}</span>
              <span>{b.title}</span>
              <span style={{ color: "var(--text-secondary)" }}>{b.start} – {b.end}</span>
              <button onClick={() => setEvents(events.filter((x) => x.id !== b.id))} className="sf-btn-ghost" style={{ padding: "3px 7px", marginLeft: "auto" }}><Icon name="x" size={12} /></button>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <select className="sf-select" value={eForm.day} onChange={(e) => setEForm({ ...eForm, day: Number(e.target.value) })}>{DAYS.map((d, i) => <option key={d} value={i}>{d}</option>)}</select>
          <input className="sf-input" placeholder="Title" value={eForm.title} onChange={(e) => setEForm({ ...eForm, title: e.target.value })} />
          <input className="sf-input" type="time" value={eForm.start} onChange={(e) => setEForm({ ...eForm, start: e.target.value })} />
          <input className="sf-input" type="time" value={eForm.end} onChange={(e) => setEForm({ ...eForm, end: e.target.value })} />
          <select className="sf-select" value={eForm.type} onChange={(e) => setEForm({ ...eForm, type: e.target.value })}>{["Sport", "Personal"].map((t) => <option key={t}>{t}</option>)}</select>
          <button className="sf-btn" onClick={() => { if (eForm.title.trim()) setEvents([...events, { ...eForm, id: "e" + Date.now() }]); }}>Add event</button>
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------
   ANALYTICS
--------------------------------------------------------- */
function AnalyticsView({ subjects, schedule, tasks, completedMinutesByTask, totalSessions, streakDisplay }) {
  const hoursBySubject = subjects.map((s) => {
    const mins = Object.values(schedule).flat().filter((sess) => sess.subjectId === s.id).reduce((a, b) => a + (b.end - b.start), 0);
    return { label: s.name.split(" ")[0], value: Math.round((mins / 60) * 10) / 10, color: s.color };
  });
  const confidenceData = subjects.map((s) => ({ label: s.name.split(" ")[0], value: s.confidence }));
  const totalLoggedMin = tasks.reduce((a, t) => a + (completedMinutesByTask[t.id] || 0), 0);
  const totalTargetMin = tasks.reduce((a, t) => a + t.duration, 0);
  const completionRate = totalTargetMin ? Math.round((totalLoggedMin / totalTargetMin) * 100) : 0;
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 20, fontWeight: 700, marginBottom: 14 }}>Analytics</h1>
      <div className="sf-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 18 }}>
        <Card><div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Task completion</div><div className="sf-title" style={{ fontSize: 22, fontWeight: 700 }}>{completionRate}%</div></Card>
        <Card><div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Sessions this week</div><div className="sf-title" style={{ fontSize: 22, fontWeight: 700 }}>{totalSessions}</div></Card>
        <Card><div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Study streak</div><div className="sf-title" style={{ fontSize: 22, fontWeight: 700 }}>{streakDisplay} {streakDisplay === 1 ? "day" : "days"}</div></Card>
      </div>
      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>Hours by subject this week</div>
        <MiniBarChart data={hoursBySubject} />
      </Card>
      <Card>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>Confidence by subject</div>
        <MiniRadar data={confidenceData} />
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------
   AI ASSISTANT
--------------------------------------------------------- */
function AssistantView({ askAssistant, answer }) {
  const prompts = [
    { id: "tonight", label: "What should I study tonight?" },
    { id: "prioritise", label: "What should I prioritise?" },
    { id: "90min", label: "I only have 90 minutes today" },
    { id: "reschedule", label: "Reschedule this week's tasks" },
  ];
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 20, fontWeight: 700, marginBottom: 4 }}>AI planning assistant</h1>
      <p style={{ fontSize: 12.5, color: "var(--text-secondary)", marginBottom: 16 }}>Ask about tonight's plan, priorities, or a quick reshuffle.</p>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
        {prompts.map((p) => <button key={p.id} className="sf-btn-ghost" onClick={() => askAssistant(p.id)} style={{ display: "flex", alignItems: "center", gap: 6 }}>{p.label} <Icon name="chevron" size={12} /></button>)}
      </div>
      {answer && <Card><div style={{ fontSize: 13, whiteSpace: "pre-line", lineHeight: 1.6 }}>{answer}</div></Card>}
    </div>
  );
}

/* ---------------------------------------------------------
   SETTINGS
--------------------------------------------------------- */
function SettingsView({ settings, setSettings, syncPin, syncStatus, connectSync, disconnectSync, generateSyncCode }) {
  function set(k, v) { setSettings({ ...settings, [k]: v }); }
  const [pinInput, setPinInput] = useState("");
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 20, fontWeight: 700, marginBottom: 14 }}>Settings</h1>
      <Card style={{ maxWidth: 440, marginBottom: 16 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>Study hours</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Field label="Weekly study hours target"><input className="sf-input" type="number" style={{ width: 90 }} value={settings.weeklyStudyHours} onChange={(e) => set("weeklyStudyHours", Number(e.target.value))} /></Field>
          <Field label="Max daily study hours"><input className="sf-input" type="number" style={{ width: 90 }} value={settings.maxDailyStudyHours} onChange={(e) => set("maxDailyStudyHours", Number(e.target.value))} /></Field>
          <Field label="Study block length (min)"><input className="sf-input" type="number" style={{ width: 90 }} value={settings.blockLength} onChange={(e) => set("blockLength", Number(e.target.value))} /></Field>
          <Field label="Break length (min)"><input className="sf-input" type="number" style={{ width: 90 }} value={settings.breakLength} onChange={(e) => set("breakLength", Number(e.target.value))} /></Field>
        </div>
      </Card>
      <Card style={{ maxWidth: 440, marginBottom: 16 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>Time boundaries</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Field label="Wake time"><input className="sf-input" type="time" value={settings.wake} onChange={(e) => set("wake", e.target.value)} /></Field>
          <Field label="Bedtime"><input className="sf-input" type="time" value={settings.bedtime} onChange={(e) => set("bedtime", e.target.value)} /></Field>
          <Field label="Buffer after school before study (min)"><input className="sf-input" type="number" style={{ width: 90 }} value={settings.afterSchoolBufferMin} onChange={(e) => set("afterSchoolBufferMin", Number(e.target.value))} /></Field>
          <Field label="Buffer before bedtime (min)"><input className="sf-input" type="number" style={{ width: 90 }} value={settings.bedtimeBufferMin} onChange={(e) => set("bedtimeBufferMin", Number(e.target.value))} /></Field>
        </div>
        <p style={{ fontSize: 11, color: "var(--text-secondary)", marginTop: 10 }}>Study is never scheduled before school ends, and never in the buffer window right before bed.</p>
      </Card>
      <Card style={{ maxWidth: 440 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 4 }}>Sync across devices</div>
        {!firebaseReady ? (
          <div style={{ fontSize: 12, color: "var(--text-secondary)", lineHeight: 1.6 }}>Not set up — add your Firebase config in the code to enable syncing between devices.</div>
        ) : syncPin ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ fontSize: 12, color: "var(--text-secondary)" }}>Status: <strong style={{ color: "var(--text-primary)" }}>{syncStatus === "synced" ? "Synced" : syncStatus === "connecting" ? "Connecting…" : "Error — check your Firebase config"}</strong></div>
            <div style={{ fontSize: 12, color: "var(--text-secondary)" }}>Your sync code:</div>
            <div className="sf-title" style={{ fontSize: 22, fontWeight: 700, letterSpacing: 2 }}>{syncPin}</div>
            <div style={{ fontSize: 11.5, color: "var(--text-secondary)" }}>Enter this same code on your other device to link it.</div>
            <button className="sf-btn-ghost" style={{ alignSelf: "flex-start" }} onClick={disconnectSync}>Stop syncing this device</button>
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ fontSize: 12, color: "var(--text-secondary)", lineHeight: 1.6 }}>Generate a code on this device, then enter the same code on your other device to keep them in sync.</div>
            <button className="sf-btn" style={{ alignSelf: "flex-start" }} onClick={generateSyncCode}>Generate sync code</button>
            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
              <input className="sf-input" placeholder="Or enter existing code" value={pinInput} onChange={(e) => setPinInput(e.target.value.toUpperCase())} style={{ flex: 1 }} />
              <button className="sf-btn-ghost" onClick={() => { if (pinInput.trim()) connectSync(pinInput.trim()); }}>Connect</button>
            </div>
          </div>
        )}
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<StudyFlow />);
</script>
</body>
</html>
