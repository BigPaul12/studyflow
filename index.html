/* ---------------------------------------------------------
   DATE HELPERS
--------------------------------------------------------- */
function daysUntil(dateStr) {
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const target = new Date(dateStr);
  return Math.round((target - now) / 86400000);
}
function toMin(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
function toHHMM(min) {
  const h = Math.floor(min / 60) % 24;
  const m = min % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}
function todayIdx() {
  return (new Date().getDay() + 6) % 7;
}

/* ---------------------------------------------------------
   SCHEDULING ENGINE
--------------------------------------------------------- */
function buildFreeSlots(dayIdx, school, work, events, settings) {
  const busy = [
    ...school.filter((b) => b.day === dayIdx).map((b) => [toMin(b.start), toMin(b.end)]),
    ...work.filter((b) => b.day === dayIdx).map((b) => [toMin(b.start), toMin(b.end)]),
    ...events.filter((b) => b.day === dayIdx).map((b) => [toMin(b.start), toMin(b.end)]),
  ].sort((a, b) => a[0] - b[0]);

  const wake = toMin(settings.wake);
  const bed = toMin(settings.bedtime);

  let free = [[wake, bed]];
  for (const [bs, be] of busy) {
    const next = [];
    for (const [fs, fe] of free) {
      if (be <= fs || bs >= fe) { next.push([fs, fe]); continue; }
      if (bs > fs) next.push([fs, bs]);
      if (be < fe) next.push([be, fe]);
    }
    free = next;
  }
  return free.filter(([s, e]) => e - s >= 20);
}

function scoreTask(task, subject) {
  const urgency = Math.max(0, 14 - task.dueInDays) * 3;
  const examProximity = subject ? Math.max(0, 90 - daysUntil(subject.examDate)) / 3 : 0;
  const priorityWeight = { High: 30, Medium: 15, Low: 5 }[task.priority] || 10;
  const confidenceGap = subject ? (10 - subject.confidence) * 4 : 0;
  const difficultyWeight = { Hard: 10, Medium: 5, Easy: 0 }[task.difficulty] || 0;
  return urgency + examProximity + priorityWeight + confidenceGap + difficultyWeight;
}

function generateSchedule(tasks, subjects, school, work, events, settings) {
  const subjectMap = Object.fromEntries(subjects.map((s) => [s.id, s]));
  const ranked = [...tasks]
    .map((t) => ({ ...t, remaining: t.duration, score: scoreTask(t, subjectMap[t.subjectId]) }))
    .sort((a, b) => b.score - a.score);

  const sessionsByDay = {};
  const dayFree = {};
  for (let d = 0; d < 7; d++) {
    dayFree[d] = buildFreeSlots(d, school, work, events, settings).map(([s, e]) => ({ start: s, end: e }));
    sessionsByDay[d] = [];
  }

  const dailyBudget = settings.maxDailyStudyHours * 60;
  const dailyUsed = Array(7).fill(0);

  for (const task of ranked) {
    let guard = 0;
    while (task.remaining > 0 && guard < 20) {
      guard++;
      let placed = false;
      for (let d = 0; d < 7 && !placed; d++) {
        if (dailyUsed[d] >= dailyBudget) continue;
        for (const slot of dayFree[d]) {
          const avail = slot.end - slot.start;
          if (avail < 20) continue;
          const remainingBudget = dailyBudget - dailyUsed[d];
          const chunk = Math.min(task.remaining, settings.blockLength, avail, remainingBudget);
          if (chunk < 20) continue;

          sessionsByDay[d].push({
            id: `${task.id}-${d}-${slot.start}`,
            taskId: task.id,
            subjectId: task.subjectId,
            title: task.title,
            start: slot.start,
            end: slot.start + chunk,
            type: "Study",
          });

          const breakLen = settings.breakLength;
          slot.start += chunk + breakLen;
          dailyUsed[d] += chunk;
          task.remaining -= chunk;
          placed = true;
          break;
        }
      }
      if (!placed) break;
    }
  }

  for (let d = 0; d < 7; d++) sessionsByDay[d].sort((a, b) => a.start - b.start);
  return sessionsByDay;
}

    case "grad": return <svg viewBox="0 0 24 24" style={s} {...common}><path d="M2 9l10-5 10 5-10 5-10-5z"/><path d="M6 11.5V17c0 1 3 2.5 6 2.5s6-1.5 6-2.5v-5.5"/></svg>;
    case "dumbbell": return <svg viewBox="0 0 24 24" style={s} {...common}><path d="M4 9v6"/><path d="M2 10v4"/><path d="M8 7v10"/><path d="M16 7v10"/><path d="M8 12h8"/><path d="M20 10v4"/><path d="M22 9v6"/></svg>;

/* ---------------------------------------------------------
   TINY SVG CHARTS (no chart library dependency)
--------------------------------------------------------- */
function MiniBarChart({ data }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 14, height: 160, padding: "0 4px" }}>
      {data.map((d) => (
        <div key={d.label} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
          <div style={{ fontSize: 11, fontWeight: 600 }}>{d.value}h</div>
          <div style={{ width: "70%", height: Math.max(4, (d.value / max) * 120), background: d.color, borderRadius: "5px 5px 2px 2px" }} />
          <div style={{ fontSize: 10.5, color: "var(--text-secondary)" }}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}

function MiniRadar({ data }) {
  const size = 220, cx = size / 2, cy = size / 2, r = 78;
  const n = data.length;
  const pts = data.map((d, i) => {
    const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
    const val = (d.value / 10) * r;
    return [cx + val * Math.cos(angle), cy + val * Math.sin(angle)];
  });
  const ringPts = (frac) => data.map((_, i) => {
    const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
    return [cx + r * frac * Math.cos(angle), cy + r * frac * Math.sin(angle)];
  }).map((p) => p.join(",")).join(" ");
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width="100%" height="220">
      {[0.33, 0.66, 1].map((f) => (
        <polygon key={f} points={ringPts(f)} fill="none" stroke="var(--border)" strokeWidth="1" />
      ))}
      <polygon points={pts.map((p) => p.join(",")).join(" ")} fill={AMBER + "55"} stroke={AMBER} strokeWidth="2" />
      {data.map((d, i) => {
        const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
        const lx = cx + (r + 18) * Math.cos(angle), ly = cy + (r + 18) * Math.sin(angle);
        return <text key={d.label} x={lx} y={ly} fontSize="10.5" textAnchor="middle" fill="var(--text-secondary)">{d.label}</text>;
      })}
    </svg>
  );
}

/* ---------------------------------------------------------
   MAIN APP
--------------------------------------------------------- */
function StudyFlow() {
  const [dark, setDark] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [subjects] = useState(seedSubjects);
  const [school, setSchool] = useState(seedSchool);
  const [work, setWork] = useState(seedWork);
  const [events, setEvents] = useState(seedEvents);
  const [tasks, setTasks] = useState(seedTasks);
  const [settings, setSettings] = useState(defaultSettings);
  const [completed, setCompleted] = useState({});
  const [assistantAnswer, setAssistantAnswer] = useState(null);
  const [saveState, setSaveState] = useState("saved");
  const loadedOnce = useRef(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data.school) setSchool(data.school);
        if (data.work) setWork(data.work);
        if (data.events) setEvents(data.events);
        if (data.tasks) setTasks(data.tasks);
        if (data.settings) setSettings(data.settings);
        if (data.completed) setCompleted(data.completed);
      }
    } catch (e) {}
    loadedOnce.current = true;
  }, []);

  useEffect(() => {
    if (!loadedOnce.current) return;
    setSaveState("saving");
    const t = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ school, work, events, tasks, settings, completed }));
        setSaveState("saved");
      } catch (e) { setSaveState("error"); }
    }, 300);
    return () => clearTimeout(t);
  }, [school, work, events, tasks, settings, completed]);

  const subjectMap = useMemo(() => Object.fromEntries(subjects.map((s) => [s.id, s])), [subjects]);
  const schedule = useMemo(() => generateSchedule(tasks, subjects, school, work, events, settings), [tasks, subjects, school, work, events, settings]);

  const today = todayIdx();
  const todaySessions = schedule[today] || [];
  const weekMinutes = Object.values(schedule).flat().reduce((a, s) => a + (s.end - s.start), 0);
  const weekHours = Math.round((weekMinutes / 60) * 10) / 10;
  const targetHours = Math.round(settings.maxDailyStudyHours * 7 * 10) / 10;
  const completedCount = Object.values(completed).filter(Boolean).length;
  const totalSessions = Object.values(schedule).flat().length;

  function addTask(t) { setTasks((prev) => [...prev, { ...t, id: "t" + Date.now() }]); }
  function removeTask(id) { setTasks((prev) => prev.filter((t) => t.id !== id)); }
  function toggleComplete(id) { setCompleted((prev) => ({ ...prev, [id]: !prev[id] })); }

  function askAssistant(question) {
    let answer = "";
    if (question === "tonight") {
      answer = todaySessions.length === 0
        ? "Nothing's scheduled for the rest of today — free time if you want to get ahead."
        : "Here's tonight's plan:\n" + todaySessions.map((s) => `${toHHMM(s.start)} – ${subjectMap[s.subjectId]?.name}: ${s.title} (${s.end - s.start} min)`).join("\n");
    } else if (question === "prioritise") {
      const worst = [...subjects].sort((a, b) => a.confidence - b.confidence)[0];
      const soonest = [...subjects].sort((a, b) => daysUntil(a.examDate) - daysUntil(b.examDate))[0];
      answer = `Focus on ${worst.name} first — it's your lowest confidence subject (${worst.confidence}/10). ${soonest.name} has the nearest exam, in ${daysUntil(soonest.examDate)} days, so keep chipping away at it too.`;
    } else if (question === "90min") {
      const pick = [...tasks].sort((a, b) => scoreTask(b, subjectMap[b.subjectId]) - scoreTask(a, subjectMap[a.subjectId]))[0];
      answer = `With 90 minutes, put it into "${pick.title}" for ${subjectMap[pick.subjectId]?.name} — it's your highest-priority open task right now. Do 2 x 40 min blocks with a short break between.`;
    } else if (question === "reschedule") {
      answer = "Schedule rebuilt around your current shifts and due dates — check the Calendar tab for the updated week.";
    }
    setAssistantAnswer(answer);
  }

  const vars = dark
    ? { "--bg": PAPER_DARK, "--card": "#1C212B", "--border": "#2A2F3A", "--text-primary": "#F3F1EA", "--text-secondary": "#9A9A93", "--nav-active": "#262B36" }
    : { "--bg": PAPER, "--card": "#FFFFFF", "--border": "#E7E4DB", "--text-primary": INK, "--text-secondary": "#6B6F7B", "--nav-active": "#F1ECDD" };

  return (
    <div style={{ ...vars, background: "var(--bg)", color: "var(--text-primary)", minHeight: "100vh", display: "flex" }}>
      <style>{`
        .sf-title { font-family: 'Space Grotesk', sans-serif; }
        .sf-input, .sf-select { font-family: 'Inter', sans-serif; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-primary); }
        .sf-btn { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px; border: none; background: ${INK}; color: white; cursor: pointer; }
        .sf-btn-ghost { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); cursor: pointer; }
        @media (max-width: 760px) {
          .sf-sidebar { position: fixed; bottom: 0; left: 0; right: 0; width: 100% !important; height: 60px; flex-direction: row !important; border-right: none !important; border-top: 1px solid var(--border); padding: 6px 8px !important; overflow-x: auto; z-index: 10; }
          .sf-sidebar .sf-logo, .sf-sidebar .sf-status, .sf-sidebar .sf-darkbtn { display: none !important; }
          .sf-sidebar button { flex-direction: column; gap: 2px !important; font-size: 10px !important; padding: 6px 4px !important; white-space: nowrap; }
          .sf-main { padding-bottom: 76px !important; }
          .sf-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
          .sf-grid-7 { grid-template-columns: repeat(7, minmax(70px,1fr)) !important; overflow-x: auto; }
        }
      `}</style>

      <div className="sf-sidebar" style={{ width: 200, borderRight: "1px solid var(--border)", padding: "1.1rem 0.85rem", display: "flex", flexDirection: "column", gap: 4 }}>
        <div className="sf-logo sf-title" style={{ fontSize: 18, fontWeight: 700, padding: "0 8px 18px", display: "flex", alignItems: "center", gap: 7 }}>
          <span style={{ width: 9, height: 9, borderRadius: 3, background: AMBER, display: "inline-block" }} /> StudyFlow
        </div>
        <IconBtn icon="home" label="Dashboard" active={tab === "dashboard"} onClick={() => setTab("dashboard")} />
        <IconBtn icon="calendar" label="Calendar" active={tab === "calendar"} onClick={() => setTab("calendar")} />
        <IconBtn icon="tasks" label="Tasks" active={tab === "tasks"} onClick={() => setTab("tasks")} />
        <IconBtn icon="grad" label="Setup" active={tab === "setup"} onClick={() => setTab("setup")} />
        <IconBtn icon="chart" label="Analytics" active={tab === "analytics"} onClick={() => setTab("analytics")} />
        <IconBtn icon="sparkles" label="AI assistant" active={tab === "assistant"} onClick={() => setTab("assistant")} />
        <IconBtn icon="gear" label="Settings" active={tab === "settings"} onClick={() => setTab("settings")} />
        <div style={{ flex: 1 }} />
        <div className="sf-status" style={{ fontSize: 10.5, color: "var(--text-secondary)", padding: "0 8px 6px" }}>
          {saveState === "saving" ? "Saving…" : saveState === "error" ? "Save failed" : "Saved on this device"}
        </div>
        <button className="sf-darkbtn sf-btn-ghost" onClick={() => setDark((d) => !d)}>{dark ? "Light mode" : "Dark mode"}</button>
      </div>

      <div className="sf-main" style={{ flex: 1, padding: "1.4rem 1.6rem", overflowY: "auto" }}>
        {tab === "dashboard" && <Dashboard subjects={subjects} todaySessions={todaySessions} weekHours={weekHours} targetHours={targetHours} completedCount={completedCount} totalSessions={totalSessions} completed={completed} toggleComplete={toggleComplete} />}
        {tab === "calendar" && <CalendarView schedule={schedule} school={school} work={work} events={events} subjects={subjects} />}
        {tab === "tasks" && <TasksView tasks={tasks} subjects={subjects} addTask={addTask} removeTask={removeTask} />}
        {tab === "setup" && <SetupView school={school} setSchool={setSchool} work={work} setWork={setWork} events={events} setEvents={setEvents} />}
        {tab === "analytics" && <AnalyticsView subjects={subjects} schedule={schedule} completedCount={completedCount} totalSessions={totalSessions} />}
        {tab === "assistant" && <AssistantView askAssistant={askAssistant} answer={assistantAnswer} />}
        {tab === "settings" && <SettingsView settings={settings} setSettings={setSettings} />}
      </div>
    </div>
  );
}

function Dashboard({ subjects, todaySessions, weekHours, targetHours, completedCount, totalSessions, completed, toggleComplete }) {
  const pct = targetHours ? Math.min(100, Math.round((weekHours / targetHours) * 100)) : 0;
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 22, fontWeight: 700, margin: "0 0 2px" }}>Good to see you</h1>
      <p style={{ color: "var(--text-secondary)", fontSize: 13, margin: "0 0 20px" }}>Here's how the week's shaping up.</p>
      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 16, marginBottom: 16 }}>
        <Card>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12, display: "flex", alignItems: "center", gap: 6 }}><Icon name="clock" size={14} /> Today's schedule</div>
          {todaySessions.length === 0 ? (
            <p style={{ fontSize: 13, color: "var(--text-secondary)" }}>No study sessions scheduled — enjoy the free time.</p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {todaySessions.map((s) => {
                const subj = subjects.find((x) => x.id === s.subjectId);
                const done = completed[s.id];
                return (
                  <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", borderRadius: 10, background: "var(--nav-active)", opacity: done ? 0.55 : 1 }}>
                    <div style={{ width: 4, height: 30, borderRadius: 3, background: subj?.color || AMBER }} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12.5, fontWeight: 600, textDecoration: done ? "line-through" : "none" }}>{s.title}</div>
                      <div style={{ fontSize: 11, color: "var(--text-secondary)" }}>{subj?.name} · {toHHMM(s.start)}–{toHHMM(s.end)}</div>
                    </div>
                    <button onClick={() => toggleComplete(s.id)} className="sf-btn-ghost" style={{ padding: "4px 8px" }}><Icon name="check" size={13} /></button>
                  </div>
                );
              })}
            </div>
          )}
        </Card>
        <Card>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>Weekly progress</div>
          <div className="sf-title" style={{ fontSize: 28, fontWeight: 700 }}>{weekHours}h <span style={{ fontSize: 14, color: "var(--text-secondary)", fontWeight: 500 }}>/ {targetHours}h</span></div>
          <div style={{ height: 6, background: "var(--nav-active)", borderRadius: 4, margin: "10px 0" }}><div style={{ height: "100%", width: pct + "%", background: AMBER, borderRadius: 4 }} /></div>
          <div style={{ fontSize: 12, color: "var(--text-secondary)" }}>{completedCount} of {totalSessions} sessions completed this week</div>
        </Card>
      </div>
      <div style={{ fontSize: 13, fontWeight: 600, margin: "22px 0 10px" }}>Exam countdown</div>
      <div className="sf-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 22 }}>
        {subjects.map((s) => {
          const d = daysUntil(s.examDate);
          const color = d <= 14 ? CAT_COLORS.Exam : d <= 35 ? "#D9822B" : d <= 60 ? "#C7A21B" : CAT_COLORS.Study;
          return (
            <Card key={s.id} style={{ borderColor: color + "55" }}>
              <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 4 }}>{s.name}</div>
              <div className="sf-title" style={{ fontSize: 24, fontWeight: 700, color }}>{d}</div>
              <div style={{ fontSize: 11, color: "var(--text-secondary)" }}>days remaining</div>
            </Card>
          );
        })}
      </div>
      <div style={{ fontSize: 13, fontWeight: 600, margin: "22px 0 10px" }}>Subject progress</div>
      <div className="sf-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12 }}>
        {subjects.map((s) => (
          <Card key={s.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontSize: 12, fontWeight: 600 }}>{s.name}</span>
              <Pill label={`${s.confidence}/10`} color={s.color} />
            </div>
            <div style={{ fontSize: 11, color: "var(--text-secondary)", marginBottom: 3 }}>Next: {s.nextAssessment}</div>
            <div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Weighting {s.weighting}%</div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function CalendarView({ schedule, school, work, events, subjects }) {
  const START = 7 * 60, END = 23 * 60, pxPerMin = 0.85;
  const subjectMap = Object.fromEntries(subjects.map((s) => [s.id, s]));
  function blocksFor(d) {
    const list = [];
    school.filter((b) => b.day === d).forEach((b) => list.push({ ...b, type: "School", label: "School" }));
    work.filter((b) => b.day === d).forEach((b) => list.push({ ...b, type: "Work", label: "Work" }));
    events.filter((b) => b.day === d).forEach((b) => list.push({ ...b, type: b.type, label: b.title }));
    (schedule[d] || []).forEach((s) => list.push({ start: toHHMM(s.start), end: toHHMM(s.end), type: "Study", label: `${subjectMap[s.subjectId]?.name}: ${s.title}` }));
    return list;
  }
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 20, fontWeight: 700, marginBottom: 4 }}>This week</h1>
      <div style={{ display: "flex", gap: 12, marginBottom: 14, flexWrap: "wrap" }}>
        {Object.entries(CAT_COLORS).filter(([k]) => k !== "Break").map(([k, c]) => (
          <span key={k} style={{ fontSize: 11, display: "flex", alignItems: "center", gap: 5, color: "var(--text-secondary)" }}><span style={{ width: 8, height: 8, borderRadius: 2, background: c }} /> {k}</span>
        ))}
      </div>
      <div className="sf-grid-7" style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 8 }}>
        {DAYS.map((day, d) => (
          <div key={day}>
            <div style={{ fontSize: 11.5, fontWeight: 600, marginBottom: 6, color: d === todayIdx() ? AMBER : "var(--text-secondary)" }}>{day}</div>
            <div style={{ position: "relative", height: (END - START) * pxPerMin, borderRadius: 10, background: "var(--card)", border: "1px solid var(--border)", overflow: "hidden" }}>
              {blocksFor(d).map((b, i) => {
                const s = toMin(b.start) - START, e = toMin(b.end) - START;
                if (e < 0 || s > END - START) return null;
                const color = CAT_COLORS[b.type] || CAT_COLORS.Personal;
                return (
                  <div key={i} title={b.label} style={{ position: "absolute", top: Math.max(0, s) * pxPerMin, height: Math.max(14, (e - s) * pxPerMin), left: 3, right: 3, background: color + "26", borderLeft: `3px solid ${color}`, borderRadius: 5, fontSize: 9.5, padding: "2px 4px", overflow: "hidden" }}>{b.label}</div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TasksView({ tasks, subjects, addTask, removeTask }) {
  const [form, setForm] = useState({ subjectId: subjects[0]?.id, title: "", duration: 60, priority: "Medium", dueInDays: 5, difficulty: "Medium", type: "Homework" });
  const subjectMap = Object.fromEntries(subjects.map((s) => [s.id, s]));
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 20, fontWeight: 700, marginBottom: 14 }}>Tasks</h1>
      <Card style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>Quick add</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(110px,1fr))", gap: 8 }}>
          <select className="sf-select" value={form.subjectId} onChange={(e) => setForm({ ...form, subjectId: e.target.value })}>{subjects.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}</select>
          <input className="sf-input" placeholder="Task title" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} style={{ gridColumn: "span 2" }} />
          <input className="sf-input" type="number" placeholder="Minutes" value={form.duration} onChange={(e) => setForm({ ...form, duration: Number(e.target.value) })} />
          <select className="sf-select" value={form.priority} onChange={(e) => setForm({ ...form, priority: e.target.value })}><option>Low</option><option>Medium</option><option>High</option></select>
          <input className="sf-input" type="number" placeholder="Due in days" value={form.dueInDays} onChange={(e) => setForm({ ...form, dueInDays: Number(e.target.value) })} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(110px,1fr))", gap: 8, marginTop: 8 }}>
          <select className="sf-select" value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>{["Homework", "Revision", "Practice questions", "Past paper", "Assignment", "Reading", "Flashcards", "Essay", "Project", "Practical"].map((t) => <option key={t}>{t}</option>)}</select>
          <select className="sf-select" value={form.difficulty} onChange={(e) => setForm({ ...form, difficulty: e.target.value })}><option>Easy</option><option>Medium</option><option>Hard</option></select>
          <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end" }}>
            <button className="sf-btn" onClick={() => { if (form.title.trim()) { addTask(form); setForm({ ...form, title: "" }); } }}><Icon name="plus" size={13} /> Add task</button>
          </div>
        </div>
      </Card>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {tasks.map((t) => {
          const subj = subjectMap[t.subjectId];
          return (
            <Card key={t.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px" }}>
              <div style={{ width: 4, height: 30, borderRadius: 3, background: subj?.color || AMBER }} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{t.title}</div>
                <div style={{ fontSize: 11, color: "var(--text-secondary)" }}>{subj?.name} · {t.type} · {t.duration} min · due in {t.dueInDays}d</div>
              </div>
              <Pill label={t.priority} color={t.priority === "High" ? CAT_COLORS.Exam : t.priority === "Medium" ? AMBER : CAT_COLORS.Study} />
              <button onClick={() => removeTask(t.id)} className="sf-btn-ghost" style={{ padding: "5px 8px" }}><Icon name="trash" size={13} /></button>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

function SetupView({ school, setSchool, work, setWork, events, setEvents }) {
  const [wForm, setWForm] = useState({ day: 0, start: "17:00", end: "21:00" });
  const [eForm, setEForm] = useState({ day: 0, start: "17:00", end: "18:00", title: "", type: "Sport" });
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 20, fontWeight: 700, marginBottom: 14 }}>Setup</h1>
      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}><Icon name="grad" size={14} /> School timetable <span style={{ fontWeight: 400, color: "var(--text-secondary)" }}>— repeats every week</span></div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {school.map((b) => (
            <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12.5 }}>
              <span style={{ width: 40, fontWeight: 600 }}>{DAYS[b.day]}</span>
              <span style={{ color: "var(--text-secondary)" }}>{b.start} – {b.end}</span>
              <button onClick={() => setSchool(school.filter((x) => x.id !== b.id))} className="sf-btn-ghost" style={{ padding: "3px 7px", marginLeft: "auto" }}><Icon name="x" size={12} /></button>
            </div>
          ))}
        </div>
      </Card>
      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}><Icon name="briefcase" size={14} /> Work shifts <span style={{ fontWeight: 400, color: "var(--text-secondary)" }}>— re-enter each Thursday</span></div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {work.map((b) => (
            <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12.5 }}>
              <span style={{ width: 40, fontWeight: 600 }}>{DAYS[b.day]}</span>
              <span style={{ color: "var(--text-secondary)" }}>{b.start} – {b.end}</span>
              <button onClick={() => setWork(work.filter((x) => x.id !== b.id))} className="sf-btn-ghost" style={{ padding: "3px 7px", marginLeft: "auto" }}><Icon name="x" size={12} /></button>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <select className="sf-select" value={wForm.day} onChange={(e) => setWForm({ ...wForm, day: Number(e.target.value) })}>{DAYS.map((d, i) => <option key={d} value={i}>{d}</option>)}</select>
          <input className="sf-input" type="time" value={wForm.start} onChange={(e) => setWForm({ ...wForm, start: e.target.value })} />
          <input className="sf-input" type="time" value={wForm.end} onChange={(e) => setWForm({ ...wForm, end: e.target.value })} />
          <button className="sf-btn" onClick={() => setWork([...work, { ...wForm, id: "w" + Date.now() }])}>Add shift</button>
        </div>
      </Card>
      <Card>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}><Icon name="dumbbell" size={14} /> Other events</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {events.map((b) => (
            <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12.5 }}>
              <span style={{ width: 40, fontWeight: 600 }}>{DAYS[b.day]}</span>
              <span>{b.title}</span>
              <span style={{ color: "var(--text-secondary)" }}>{b.start} – {b.end}</span>
              <button onClick={() => setEvents(events.filter((x) => x.id !== b.id))} className="sf-btn-ghost" style={{ padding: "3px 7px", marginLeft: "auto" }}><Icon name="x" size={12} /></button>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <select className="sf-select" value={eForm.day} onChange={(e) => setEForm({ ...eForm, day: Number(e.target.value) })}>{DAYS.map((d, i) => <option key={d} value={i}>{d}</option>)}</select>
          <input className="sf-input" placeholder="Title" value={eForm.title} onChange={(e) => setEForm({ ...eForm, title: e.target.value })} />
          <input className="sf-input" type="time" value={eForm.start} onChange={(e) => setEForm({ ...eForm, start: e.target.value })} />
          <input className="sf-input" type="time" value={eForm.end} onChange={(e) => setEForm({ ...eForm, end: e.target.value })} />
          <select className="sf-select" value={eForm.type} onChange={(e) => setEForm({ ...eForm, type: e.target.value })}>{["Sport", "Personal"].map((t) => <option key={t}>{t}</option>)}</select>
          <button className="sf-btn" onClick={() => { if (eForm.title.trim()) setEvents([...events, { ...eForm, id: "e" + Date.now() }]); }}>Add event</button>
        </div>
      </Card>
    </div>
  );
}

function AnalyticsView({ subjects, schedule, completedCount, totalSessions }) {
  const hoursBySubject = subjects.map((s) => {
    const mins = Object.values(schedule).flat().filter((sess) => sess.subjectId === s.id).reduce((a, b) => a + (b.end - b.start), 0);
    return { label: s.name.split(" ")[0], value: Math.round((mins / 60) * 10) / 10, color: s.color };
  });
  const confidenceData = subjects.map((s) => ({ label: s.name.split(" ")[0], value: s.confidence }));
  const completionRate = totalSessions ? Math.round((completedCount / totalSessions) * 100) : 0;
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 20, fontWeight: 700, marginBottom: 14 }}>Analytics</h1>
      <div className="sf-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 18 }}>
        <Card><div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Task completion</div><div className="sf-title" style={{ fontSize: 22, fontWeight: 700 }}>{completionRate}%</div></Card>
        <Card><div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Sessions this week</div><div className="sf-title" style={{ fontSize: 22, fontWeight: 700 }}>{totalSessions}</div></Card>
        <Card><div style={{ fontSize: 11, color: "var(--text-secondary)" }}>Study streak</div><div className="sf-title" style={{ fontSize: 22, fontWeight: 700 }}>3 days</div></Card>
      </div>
      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>Hours by subject this week</div>
        <MiniBarChart data={hoursBySubject} />
      </Card>
      <Card>
        <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>Confidence by subject</div>
        <MiniRadar data={confidenceData} />
      </Card>
    </div>
  );
}

function AssistantView({ askAssistant, answer }) {
  const prompts = [
    { id: "tonight", label: "What should I study tonight?" },
    { id: "prioritise", label: "What should I prioritise?" },
    { id: "90min", label: "I only have 90 minutes today" },
    { id: "reschedule", label: "Reschedule this week's tasks" },
  ];
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 20, fontWeight: 700, marginBottom: 4 }}>AI planning assistant</h1>
      <p style={{ fontSize: 12.5, color: "var(--text-secondary)", marginBottom: 16 }}>Ask about tonight's plan, priorities, or a quick reshuffle.</p>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
        {prompts.map((p) => <button key={p.id} className="sf-btn-ghost" onClick={() => askAssistant(p.id)} style={{ display: "flex", alignItems: "center", gap: 6 }}>{p.label} <Icon name="chevron" size={12} /></button>)}
      </div>
      {answer && <Card><div style={{ fontSize: 13, whiteSpace: "pre-line", lineHeight: 1.6 }}>{answer}</div></Card>}
    </div>
  );
}

function SettingsView({ settings, setSettings }) {
  function set(k, v) { setSettings({ ...settings, [k]: v }); }
  return (
    <div>
      <h1 className="sf-title" style={{ fontSize: 20, fontWeight: 700, marginBottom: 14 }}>Settings</h1>
      <Card style={{ maxWidth: 420 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Field label="Wake time"><input className="sf-input" type="time" value={settings.wake} onChange={(e) => set("wake", e.target.value)} /></Field>
          <Field label="Bedtime"><input className="sf-input" type="time" value={settings.bedtime} onChange={(e) => set("bedtime", e.target.value)} /></Field>
          <Field label="Max daily study hours"><input className="sf-input" type="number" value={settings.maxDailyStudyHours} onChange={(e) => set("maxDailyStudyHours", Number(e.target.value))} /></Field>
          <Field label="Study block length (min)"><input className="sf-input" type="number" value={settings.blockLength} onChange={(e) => set("blockLength", Number(e.target.value))} /></Field>
          <Field label="Break length (min)"><input className="sf-input" type="number" value={settings.breakLength} onChange={(e) => set("breakLength", Number(e.target.value))} /></Field>
        </div>
      </Card>
    </div>
  );
}
function Field({ label, children }) {
  return <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}><span style={{ fontSize: 12.5, color: "var(--text-secondary)" }}>{label}</span>{children}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<StudyFlow />);
</script>
</body>
</html>
